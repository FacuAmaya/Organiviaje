name: Bug
description: Algo no funciona como debería
title: "bug: "
labels: ["tipo:bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dispositivo / navegador
      placeholder: iPhone 13 · Safari / Chrome desktop
