# Entorno de desarrollo local.
# Postgres se expone en el puerto 5433 del host para no chocar con un Postgres instalado localmente.
# Por ahora solo la base de datos; api, web y redis se suman en la rama base/03-docker-y-ci.
#   docker compose up -d db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-organiviaje}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organiviaje}
      POSTGRES_DB: ${POSTGRES_DB:-organiviaje}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
